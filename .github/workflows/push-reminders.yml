name: Push Reminder Notifications

on:
  schedule:
    - cron: '*/5 * * * *'   # Respaldo: en la práctica GitHub lo corre cada ~4,6 h
  workflow_dispatch:          # Lo dispara el Worker de Cloudflare cada 5 min (cf-worker, Cron Trigger) y también sirve a mano

# Nunca dos corridas a la vez: duplicarían avisos (ambas leerían el mismo notifiedReminders). La que llega
# mientras otra corre queda en cola (solo una; la más nueva reemplaza a la pendiente) y no cancela a la que está enviando.
concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send reminder push notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node push-reminders.js
