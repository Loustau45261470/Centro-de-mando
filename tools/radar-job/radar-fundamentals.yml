# ════════════════════════════════════════════════════════════════════════════════
# Radar de empresas — baja los fundamentals de la SEC y los guarda como fund-<TICKER>.json + fund-index.json
#
# ESTE ARCHIVO SE SUBE AL REPO PRIVADO  Loustau45261470/centro-de-mando-datos  en  .github/workflows/radar-fundamentals.yml
# (no corre desde el repo público). El código (radar-calc.js y tools/radar-job/run.js) vive COPIADO en este repo privado: no se baja nada del repo público. Pasos exactos: cf-worker/README.md, sección "Radar de empresas".
#
# Cuándo corre:
#   - todos los días hábiles ~06:30 de Argentina: refresca todas las empresas que ya tienen fund-<TICKER>.json
#     (así el TTM se pone al día apenas la empresa presenta un reporte nuevo; el precio NO pasa por acá, es en vivo)
#   - a pedido de la app (el Worker lo dispara con workflow_dispatch al agregar una empresa nueva o una posición nueva de la cartera)
#   - a mano: pestaña Actions del repo → radar-fundamentals → Run workflow
#
# Secret requerido (repo privado → Settings → Secrets and variables → Actions):
#   SEC_USER_AGENT   ej:  Centro de Mando tu-mail@ejemplo.com     (la SEC lo exige; así no queda ningún mail en el repo público)
# ════════════════════════════════════════════════════════════════════════════════
name: radar-fundamentals

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 09:30 UTC = 06:30 en Buenos Aires
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers separados por coma (vacío = todos los que ya están cargados)'
        required: false
        default: ''

# Un solo proceso a la vez: dos corridas juntas se pisarían al hacer commit.
concurrency:
  group: radar-fundamentals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repo de datos (privado)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bajar fundamentals de la SEC
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TICKERS: ${{ github.event.inputs.tickers }}   # por variable de entorno, nunca pegado en el comando (evita inyección); run.js lo valida
        run: node tools/radar-job/run.js --datos . --tickers "$TICKERS"

      - name: Guardar cambios
        run: |
          git config user.name "radar-fundamentals"
          git config user.email "radar-fundamentals@users.noreply.github.com"
          git add fund-*.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "datos: fundamentals de la SEC"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::No se pudo hacer push"; exit 1
