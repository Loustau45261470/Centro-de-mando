name = "cdm-push-worker"
main = "src/index.js"
compatibility_date = "2026-08-17"
account_id = "670b8efbac8b8c275e2a849e9f130bee"

[[durable_objects.bindings]]
name = "TIMER"
class_name = "TimerAlarm"

[[durable_objects.bindings]]
name = "CARTERA"
class_name = "CarteraGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TimerAlarm"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CarteraGate"]

[vars]
# Repo PRIVADO con los archivos de la cartera (ruta GET /datos/<archivo>.json). No es un secreto; el token de GitHub va como secret GH_DATA_TOKEN.
DATOS_REPO = "Loustau45261470/centro-de-mando-datos"
